# Builds the macOS installer (.pkg). Runs on every push to rvm-fix or main, or from
# Actions > "Build macOS" > Run workflow. Download the result from the run's Artifacts.
name: Build macOS

on:
  push:
    branches: [rvm-fix, main]
  workflow_dispatch:

permissions: {}

jobs:
  ci-config:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-config.yml

  build-macos:
    needs: ci-config
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-build-macos.yml
    with:
      job-index: 0
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      OSX_DEPLOYMENT_TARGET: ${{ needs.ci-config.outputs.OSX_DEPLOYMENT_TARGET }}
      VCPKG_BINARY_SOURCES: ${{ needs.ci-config.outputs.VCPKG_BINARY_SOURCES }}
